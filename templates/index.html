<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>員工心聲回饋箱 | 關懷與傾聽</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 🌟 新增：錄音時的閃爍動畫 */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        .pulse-animation {
            animation: pulse 1.5s infinite;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F4F7F5;
            color: #2D3732;
        }
        .main-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(74, 124, 89, 0.1);
            background-color: #FFFFFF;
        }
        .info-panel {
            padding: 2rem;
            border-radius: 20px;
            background-color: transparent;
        }
        .btn-sage {
            background-color: #4A7C59;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-sage:hover {
            background-color: #3B6347;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 124, 89, 0.3);
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #D1D9D3;
            background-color: #FAFAFA;
        }
        .form-control:focus {
            border-color: #4A7C59;
            box-shadow: 0 0 0 0.25rem rgba(74, 124, 89, 0.25);
        }
        .feature-icon {
            font-size: 1.5rem;
            color: #4A7C59;
            margin-right: 10px;
        }
        .emergency-box {
            background-color: #FFF0F0;
            border-left: 4px solid #E74C3C;
            border-radius: 8px;
            padding: 1rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm mb-5">
  <div class="container">
    <span class="navbar-brand mb-0 h1 fw-bold" style="color: #4A7C59;">🌱 HR 傾聽計畫</span>
  </div>
</nav>

<div class="container">
    <div class="row align-items-center justify-content-between">
        
        <div class="col-lg-5 mb-5 mb-lg-0 info-panel">
            <h2 class="fw-bold mb-4">您的聲音，<br>是團隊進步的指標。</h2>
            <p class="text-muted mb-5">我們致力於打造一個開放、安全的職場環境。無論是工作上的成就、流程上的建議，或是難以消化的情緒，這裡隨時為您敞開。</p>
            
            <div class="mb-4 d-flex align-items-start">
                <div class="feature-icon">🔒</div>
                <div>
                    <h6 class="fw-bold mb-1">絕對匿名保護</h6>
                    <p class="text-muted small">系統將進行去識別化處理，您的真實身分不會未經同意透露給直屬主管。</p>
                </div>
            </div>

            <div class="mb-4 d-flex align-items-start">
                <div class="feature-icon">💡</div>
                <div>
                    <h6 class="fw-bold mb-1">不知道說什麼？您可以分享：</h6>
                    <ul class="text-muted small ps-3">
                        <li>近期專案的成就感與挑戰</li>
                        <li>辦公室硬體設備的改善建議</li>
                        <li>團隊合作或溝通上的困擾</li>
                    </ul>
                </div>
            </div>

            <div class="emergency-box mt-5">
                <h6 class="fw-bold text-danger mb-1"><small>🆘 心理支持與協助</small></h6>
                <p class="mb-0 small" style="color: #555;">若您正面臨難以承受的壓力，請讓我們接住您。<br>EAP 員工協助專線：<strong>0800-676767</strong></p>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card main-card p-4 p-md-5">
                <h4 class="mb-4 fw-bold text-center">寫下您的回饋</h4>
                
                <form id="feedbackForm">
    <div class="mb-3">
        <label for="name" class="form-label fw-bold text-muted small">怎麼稱呼您？ (選填)</label>
        <input type="text" class="form-control" id="name" placeholder="若留空將以匿名送出">
    </div>

    <div class="mb-3">
        <label for="department" class="form-label fw-bold text-muted small">所屬部門 (必填)</label>
        <select class="form-control" id="department" required>
            <option value="" disabled selected>請選擇您的部門</option>
            <option value="研發部">研發部 (R&D)</option>
            <option value="業務部">業務部 (Sales)</option>
            <option value="行銷部">行銷部 (Marketing)</option>
            <option value="行政人資部">行政人資部 (HR/Admin)</option>
            <option value="財務部">財務部 (Finance)</option>
            <option value="客戶服務部">客戶服務部 (CS)</option>
            <option value="其他">其他</option>
        </select>
    </div>
    <div class="mb-4">
        <label for="feedback" class="form-label fw-bold text-muted small">想說的話 (必填)</label>
        <textarea class="form-control mb-2" id="feedback" rows="6" placeholder="請告訴我們您的真實感受，或是點擊下方麥克風用語音輸入..."></textarea>
        
        <!-- 🌟 新增：語音輸入區塊 -->
        <div class="d-flex align-items-center gap-3 bg-light p-2 rounded-3 border" style="background-color: #f8f9fa;">
            <button id="record-btn" type="button" class="btn btn-outline-danger rounded-circle p-2 shadow-sm d-flex justify-content-center align-items-center" style="width: 50px; height: 50px; transition: 0.3s;">
                <span id="record-icon" class="fs-4" style="line-height: 1;">🎙️</span>
            </button>
            <div>
                <h6 class="mb-1 fw-bold text-dark" id="record-status" style="font-size: 0.95rem;">語音輸入</h6>
                <small class="text-muted" id="record-timer">點擊開始錄音</small>
            </div>
            <!-- 隱藏的播放器 -->
            <audio id="audio-preview" controls class="ms-auto" style="display: none; height: 35px; width: 150px;"></audio>
        </div>
    </div>  
    
    <button type="submit" id="submitBtn" class="btn btn-sage w-100 py-2 shadow-sm">
        安全送出回饋
    </button>
</form>
                
                <div id="replyBox" class="mt-4 p-4 d-none" style="background-color: #F4F7F5; border-radius: 15px; border-left: 5px solid #4A7C59;">
                    <strong style="color: #4A7C59;">HR 顧問回覆：</strong>
                    <p id="replyText" class="mt-2 mb-0"></p>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // ==========================================
// 🎙️ 語音轉文字模組 (STT Engine)
// ==========================================
let mediaRecorder;
let audioChunks = [];
let isRecording = false;
let recordTimerInterval;
let seconds = 0;

const recordBtn = document.getElementById('record-btn');
const recordIcon = document.getElementById('record-icon');
const recordStatus = document.getElementById('record-status');
const recordTimer = document.getElementById('record-timer');
const audioPreview = document.getElementById('audio-preview');
const feedbackInputArea = document.getElementById('feedback');

recordBtn.addEventListener('click', async () => {
    if (!isRecording) await startRecording();
    else stopRecording();
});

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            
            // 讓員工可以試聽
            audioPreview.src = audioUrl;
            audioPreview.style.display = 'block';
            
            // UI 切換為轉譯中
            recordStatus.innerText = '⏳ 正在轉成文字...';
            recordTimer.innerText = '請稍候，AI 努力辨識中';
            recordBtn.disabled = true; // 轉譯期間禁止重複點擊

            // 🚀 將音檔送給後端轉成文字
            await transcribeAudio(audioBlob);
        };

        mediaRecorder.start();
        isRecording = true;
        
        recordBtn.classList.replace('btn-outline-danger', 'btn-danger');
        recordBtn.classList.add('pulse-animation');
        recordIcon.innerText = '⏹️';
        recordStatus.innerText = '🔴 錄音中...';
        audioPreview.style.display = 'none'; // 隱藏播放器
        
        seconds = 0;
        recordTimerInterval = setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            recordTimer.innerText = `${mins}:${secs}`;
        }, 1000);

    } catch (err) {
        alert("無法存取麥克風，請確認瀏覽器權限設定！");
        console.error(err);
    }
}

function stopRecording() {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(track => track.stop());
    
    isRecording = false;
    clearInterval(recordTimerInterval);
    
    recordBtn.classList.replace('btn-danger', 'btn-outline-danger');
    recordBtn.classList.remove('pulse-animation');
    recordIcon.innerText = '🎙️';
}

// 將音檔打 API 給後端，並將結果填入輸入框
async function transcribeAudio(audioBlob) {
    try {
        const formData = new FormData();
        // 幫檔案取個名字，Gemini 才知道這是音檔
        formData.append('audio_file', audioBlob, 'recording.webm'); 

        // 呼叫我們等一下要在 app.py 寫的新 API
        const response = await fetch('/api/transcribe', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();
        
        if (result.success) {
            // 把辨識出來的文字，優雅地疊加進文字框裡！
            const currentText = feedbackInputArea.value;
            feedbackInputArea.value = currentText + (currentText ? '\n' : '') + result.text;
            
            recordStatus.innerText = '✅ 轉換成功！';
            recordTimer.innerText = '您可以直接修改上方文字，或點擊試聽';
        } else {
            recordStatus.innerText = '❌ 轉換失敗';
            recordTimer.innerText = result.error || '請再試一次或手動輸入';
        }
    } catch (error) {
        console.error('Transcription error:', error);
        recordStatus.innerText = '❌ 連線異常';
        recordTimer.innerText = '無法連上伺服器，請手動輸入';
    } finally {
        recordBtn.disabled = false;
    }
}
    document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // 防止表單送出時網頁重新整理

        // 抓取畫面上的元素
        const submitBtn = document.getElementById('submitBtn');
        const nameInput = document.getElementById('name').value;
        const deptInput = document.getElementById('department').value;
        const feedbackInput = document.getElementById('feedback').value;
        const replyBox = document.getElementById('replyBox');
        const replyText = document.getElementById('replyText');

        // 防呆機制：沒寫內容不能送出
        if (!feedbackInput.trim()) {
            alert('請告訴我們您想說的話喔！');
            return;
        }

        // 1. 改變按鈕狀態，給予使用者「正在處理」的安心感
        submitBtn.disabled = true;
        submitBtn.innerText = '🌱 顧問正在用心閱讀中...';
        replyBox.classList.add('d-none'); // 先隱藏之前的回覆

        try {
            // 2. 把資料打包，透過 API 送給 Python (app.py) 進行情緒分析並存入資料庫
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: nameInput,
                    department: deptInput,
                    feedback: feedbackInput
                })
            });

            const result = await response.json();

            if (result.success) {
                // 3. 成功收到 AI 回覆！顯示在畫面上
                replyText.innerText = result.data.Reply;
                replyBox.classList.remove('d-none');
                
                // 清空留言框，準備迎接下一筆留言
                document.getElementById('feedback').value = '';
            } else {
                alert('發生錯誤：' + result.error);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('系統連線發生異常，請確認後端伺服器是否運行中。');
        } finally {
            // 4. 不管成功或失敗，最後都要把按鈕恢復原狀
            submitBtn.disabled = false;
            submitBtn.innerText = '安全送出回饋';
        }
    });
</script>
</body>
</html>
