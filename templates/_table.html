<!-- =========================================================
     回饋管理
     ========================================================= -->

<style>

    /* =====================================================
       Feedback page
       ===================================================== */

    .feedback-page {
        width: 100%;
    }


    /* =====================================================
       Toolbar
       ===================================================== */

    .feedback-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;

        margin-bottom: 16px;
    }


    .feedback-toolbar-title {
        margin: 0;

        color: #18201c;

        font-size: 17px;
        font-weight: 700;
    }


    .feedback-toolbar-description {
        margin-top: 5px;

        color: #667085;

        font-size: 12px;
        line-height: 1.6;
    }


    .feedback-toolbar-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;

        gap: 8px;
    }


    .feedback-toolbar-actions .form-select {
        width: auto;
        min-width: 174px;
    }


    /* =====================================================
       Batch actions
       ===================================================== */

    #batch-action-buttons {
        align-items: center;
        flex-wrap: wrap;

        gap: 8px;
    }


    #batch-action-buttons .btn {
        white-space: nowrap;
    }


    /* =====================================================
       Filters
       ===================================================== */

    .feedback-filter-card {
        margin-bottom: 16px;

        padding: 18px;

        border: 1px solid #e4e7ec;
        border-radius: 12px;

        background: #ffffff;

        box-shadow:
            0 1px 2px rgba(16, 24, 40, 0.04),
            0 1px 3px rgba(16, 24, 40, 0.04);
    }


    .feedback-filter-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 16px;

        margin-bottom: 14px;
    }


    .feedback-filter-title {
        margin: 0;

        color: #344054;

        font-size: 12px;
        font-weight: 700;
    }


    .feedback-filter-description {
        margin-top: 3px;

        color: #98a2b3;

        font-size: 10.5px;
    }


    .feedback-filter-grid {
        display: grid;

        grid-template-columns:
            minmax(270px, 1.5fr)
            repeat(4, minmax(150px, 1fr));

        gap: 12px;

        align-items: end;
    }


    .filter-field {
        min-width: 0;
    }


    .filter-label {
        display: block;

        margin-bottom: 6px;

        color: #667085;

        font-size: 10.5px;
        font-weight: 600;
    }


    .date-range-fields {
        display: grid;

        grid-template-columns:
            minmax(0, 1fr)
            auto
            minmax(0, 1fr);

        align-items: center;

        gap: 7px;
    }


    .date-range-separator {
        color: #98a2b3;

        font-size: 11px;
    }


    .feedback-filter-card .form-control,
    .feedback-filter-card .form-select {
        width: 100%;
        height: 38px;

        min-height: 38px;

        padding-top: 0;
        padding-bottom: 0;

        font-size: 12px;
    }


    /* =====================================================
       Information bar
       ===================================================== */

    .feedback-info-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 18px;

        margin-bottom: 16px;

        padding: 11px 14px;

        border: 1px solid #e4e7ec;
        border-radius: 10px;

        background: #fafcfb;
    }


    .feedback-info-main {
        color: #667085;

        font-size: 11px;
        line-height: 1.6;
    }


    .feedback-info-main strong {
        color: #344054;

        font-weight: 650;
    }


    .feedback-info-tags {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;

        gap: 6px;
    }


    .feedback-info-tag {
        display: inline-flex;
        align-items: center;

        min-height: 24px;

        padding: 4px 8px;

        border: 1px solid #dfe6e2;
        border-radius: 999px;

        background: #ffffff;

        color: #5b6b63;

        font-size: 10px;
        font-weight: 600;

        white-space: nowrap;
    }


    /* =====================================================
       Table shell
       ===================================================== */

    .feedback-table-card {
        overflow: hidden;

        border: 1px solid #e4e7ec;
        border-radius: 12px;

        background: #ffffff;

        box-shadow:
            0 1px 2px rgba(16, 24, 40, 0.04),
            0 1px 3px rgba(16, 24, 40, 0.05);
    }


    .feedback-table-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 16px;

        padding: 16px 20px;

        border-bottom: 1px solid #edf0f2;
    }


    .feedback-table-card-title {
        margin: 0;

        color: #18201c;

        font-size: 14px;
        font-weight: 700;
    }


    .feedback-table-card-description {
        margin-top: 4px;

        color: #98a2b3;

        font-size: 10.5px;
    }


    .feedback-table-scroll {
        width: 100%;

        overflow-x: auto;
    }


    /* =====================================================
       Main table
       ===================================================== */

    #feedbackTable {
        width: 100%;

        min-width: 1160px;

        margin-bottom: 0;

        table-layout: fixed;
    }


    #feedbackTable thead th {
        height: 46px;

        padding:
            0 14px;

        vertical-align: middle;

        color: #667085;

        background: #f8faf9;

        border-bottom: 1px solid #e4e7ec;

        font-size: 10.5px;
        font-weight: 700;

        white-space: nowrap;
    }


    /*
       一般模式：
       時間與分類 / 回饋內容 / 分析摘要 / 操作
    */

    #feedbackTable thead th:nth-child(1) {
        width: 14%;
    }


    #feedbackTable thead th:nth-child(2) {
        width: 32%;
    }


    #feedbackTable thead th:nth-child(3) {
        width: 40%;
    }


    #feedbackTable thead th:nth-child(4) {
        width: 14%;
    }


    /* =====================================================
       固定每筆資料高度
       ===================================================== */

    #feedbackTable tbody tr {
        height: 150px;
    }


    #feedbackTable tbody td {
        height: 150px;

        padding:
            12px 14px;

        vertical-align: top;

        border-bottom:
            1px solid #edf0f2;

        color: #344054;

        font-size: 12px;

        line-height: 1.5;
    }


    #feedbackTable tbody tr:last-child td {
        border-bottom: 0;
    }


    #feedbackTable tbody tr:hover > td {
        background:
            #fcfdfc;
    }


    /* =====================================================
       Column 1 — metadata
       ===================================================== */

    #feedbackTable tbody td:first-child small {
        display: block;

        color: #667085 !important;

        font-size: 10.5px;

        line-height: 1.45;
    }


    #feedbackTable tbody td:first-child .badge {
        max-width: 100%;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
    }


    /* =====================================================
       Column 2 — feedback text
       ===================================================== */

    #feedbackTable tbody td:nth-child(2) p {
        display: -webkit-box;

        max-height: 74px;

        margin: 0;

        overflow: hidden;

        color: #344054;

        font-size: 12.5px;

        line-height: 1.55;

        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;

        line-clamp: 3;

        word-break: break-word;
    }


    #feedbackTable tbody td:nth-child(2)::after {
        display: block;

        margin-top: 7px;

        color: #98a2b3;

        font-size: 9.5px;

        content: "完整內容可於分析詳情中查看";
    }


    /* =====================================================
       Column 3 — analysis summary
       ===================================================== */

    #feedbackTable .theory-summary {
        min-height: 26px;

        margin-top: 7px;
    }


    #feedbackTable .theory-badge {
        max-width: 150px;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
    }


    /*
       列表不顯示分析依據。
       admin.html 仍然保留資料，
       Modal 內仍可完整查看。
    */

    #feedbackTable .reasoning-box {
        display: none !important;
    }


    #feedbackTable td:nth-child(3) > .btn {
        min-width: 104px;

        height: 32px;
        min-height: 32px;

        margin-top: 10px !important;

        padding:
            0 10px;

        font-size: 10.5px;
    }


    /* =====================================================
       Action column
       ===================================================== */

    #feedbackTable tbody td:last-child {
        padding-top: 13px;
        padding-bottom: 13px;

        vertical-align: middle;
    }


    #feedbackTable tbody td:last-child .btn {
        display: flex;

        width: 100%;
        height: 32px;
        min-height: 32px;

        align-items: center;
        justify-content: center;

        margin-bottom: 6px !important;

        padding:
            0 8px;

        font-size: 10.5px;
        line-height: 1.2;
    }


    #feedbackTable tbody td:last-child .btn:last-child {
        margin-bottom: 0 !important;
    }


    /* =====================================================
       Sentiment
       ===================================================== */

    #feedbackTable .badge-sentiment {
        min-width: 70px;

        text-align: center;
    }


    /* =====================================================
       Batch mode checkbox
       ===================================================== */

    #feedbackTable .row-checkbox {
        width: 17px;
        height: 17px;

        margin-top: 3px;

        cursor: pointer;
    }


    /* =====================================================
       DataTable controls
       ===================================================== */

    .feedback-table-card .dataTable-wrapper {
        padding: 0;
    }


    .feedback-table-card .dataTable-top {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 16px;

        padding:
            13px 20px;

        border-bottom:
            1px solid #edf0f2;
    }


    .feedback-table-card .dataTable-dropdown {
        display: flex;
        align-items: center;

        gap: 7px;

        color: #667085;

        font-size: 11px;
    }


    .feedback-table-card .dataTable-selector {
        width: 68px;
        height: 34px;

        padding:
            0 8px;
    }


    .feedback-table-card .dataTable-search {
        margin-left: auto;
    }


    .feedback-table-card .dataTable-search label {
        display: flex;
        align-items: center;

        gap: 7px;

        color: #667085;

        font-size: 11px;
    }


    .feedback-table-card .dataTable-input {
        width: 210px;
        height: 34px;

        padding:
            0 10px;
    }


    .feedback-table-card .dataTable-bottom {
        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 16px;

        padding:
            12px 20px;

        border-top:
            1px solid #edf0f2;
    }


    .feedback-table-card .dataTable-info {
        color: #98a2b3;

        font-size: 10.5px;
    }


    /* =====================================================
       Responsive
       ===================================================== */

    @media (max-width: 1250px) {

        .feedback-filter-grid {
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
        }


        .filter-date {
            grid-column:
                span 2;
        }

    }


    @media (max-width: 767px) {

        .feedback-toolbar {
            align-items: stretch;

            flex-direction: column;
        }


        .feedback-toolbar-actions {
            justify-content: flex-start;
        }


        .feedback-filter-grid {
            grid-template-columns: 1fr;
        }


        .filter-date {
            grid-column: auto;
        }


        .feedback-info-bar {
            align-items: flex-start;

            flex-direction: column;
        }


        .feedback-info-tags {
            justify-content: flex-start;
        }


        .feedback-table-card .dataTable-top,
        .feedback-table-card .dataTable-bottom {
            align-items: flex-start;

            flex-direction: column;
        }


        .feedback-table-card .dataTable-search {
            width: 100%;

            margin-left: 0;
        }


        .feedback-table-card .dataTable-search label {
            width: 100%;
        }


        .feedback-table-card .dataTable-input {
            width: 100%;
        }

    }

</style>



<div class="feedback-page">


    <!-- ===================================================== -->
    <!-- Toolbar -->
    <!-- ===================================================== -->

    <div class="feedback-toolbar">

        <div>

            <h2 class="feedback-toolbar-title">
                回饋資料
            </h2>


            <div class="feedback-toolbar-description">
                查看員工原始回饋、分析摘要與 HR 後續處理狀態。
            </div>

        </div>



        <div class="feedback-toolbar-actions">


            <div
                id="batch-action-buttons"
                style="display: none;"
            >

                <button
                    type="button"
                    class="
                        btn
                        btn-sm
                        btn-outline-primary
                    "
                    onclick="batchAction('correct')"
                >
                    批次校正情緒
                </button>


                <button
                    type="button"
                    class="
                        btn
                        btn-sm
                        btn-outline-warning
                    "
                    onclick="batchAction('classic')"
                >
                    批次切換參考範例
                </button>


                <button
                    type="button"
                    class="
                        btn
                        btn-sm
                        btn-outline-danger
                    "
                    onclick="batchAction('delete')"
                >
                    批次刪除
                </button>

            </div>



            <select
                id="sort-order"
                class="
                    form-select
                    form-select-sm
                "
                onchange="applyFilters()"
                aria-label="時間排序"
            >

                <option value="desc">
                    時間：最新優先
                </option>

                <option value="asc">
                    時間：最舊優先
                </option>

            </select>



            <button
                type="button"
                id="toggle-edit-mode"
                class="
                    btn
                    btn-sm
                    btn-outline-secondary
                "
                onclick="toggleEditMode()"
            >
                開啟批次操作
            </button>

        </div>

    </div>



    <!-- ===================================================== -->
    <!-- Filters -->
    <!-- ===================================================== -->

    <div class="feedback-filter-card">

        <div class="feedback-filter-header">

            <div>

                <h3 class="feedback-filter-title">
                    篩選條件
                </h3>


                <div class="feedback-filter-description">
                    依日期、部門、情緒、議題或參考範例狀態篩選回饋。
                </div>

            </div>


            <button
                type="button"
                class="
                    btn
                    btn-sm
                    btn-outline-secondary
                "
                onclick="resetFeedbackFilters()"
            >
                清除篩選
            </button>

        </div>



        <div class="feedback-filter-grid">


            <div class="filter-field filter-date">

                <label
                    class="filter-label"
                    for="filter-start-date"
                >
                    日期範圍
                </label>


                <div class="date-range-fields">

                    <input
                        type="date"
                        id="filter-start-date"
                        class="
                            form-control
                            form-control-sm
                        "
                        onchange="applyFilters()"
                        aria-label="開始日期"
                    >


                    <span class="date-range-separator">
                        至
                    </span>


                    <input
                        type="date"
                        id="filter-end-date"
                        class="
                            form-control
                            form-control-sm
                        "
                        onchange="applyFilters()"
                        aria-label="結束日期"
                    >

                </div>

            </div>



            <div class="filter-field">

                <label
                    class="filter-label"
                    for="filter-dept"
                >
                    部門
                </label>


                <select
                    id="filter-dept"
                    class="
                        form-select
                        form-select-sm
                    "
                    onchange="applyFilters()"
                >

                    <option value="all">
                        全部部門
                    </option>

                    <option value="研發部">
                        研發部
                    </option>

                    <option value="業務部">
                        業務部
                    </option>

                    <option value="行銷部">
                        行銷部
                    </option>

                    <option value="行政人資部">
                        行政人資部
                    </option>

                    <option value="財務部">
                        財務部
                    </option>

                    <option value="客戶服務部">
                        客戶服務部
                    </option>

                    <option value="其他">
                        其他
                    </option>

                </select>

            </div>



            <div class="filter-field">

                <label
                    class="filter-label"
                    for="filter-sentiment"
                >
                    整體情緒
                </label>


                <select
                    id="filter-sentiment"
                    class="
                        form-select
                        form-select-sm
                    "
                    onchange="applyFilters()"
                >

                    <option value="all">
                        全部情緒
                    </option>

                    <option value="Positive">
                        正面
                    </option>

                    <option value="Neutral">
                        中立
                    </option>

                    <option value="Negative">
                        負面
                    </option>

                </select>

            </div>



            <div class="filter-field">

                <label
                    class="filter-label"
                    for="filter-category"
                >
                    議題分類
                </label>


                <select
                    id="filter-category"
                    class="
                        form-select
                        form-select-sm
                    "
                    onchange="applyFilters()"
                >

                    <option value="all">
                        全部議題
                    </option>

                    <option value="工作負載">
                        工作負載
                    </option>

                    <option value="人際關係與管理">
                        人際關係與管理
                    </option>

                    <option value="薪資福利">
                        薪資福利
                    </option>

                    <option value="硬體與環境">
                        硬體與環境
                    </option>

                    <option value="職涯發展">
                        職涯發展
                    </option>

                    <option value="其他">
                        其他
                    </option>

                </select>

            </div>



            <div class="filter-field">

                <label
                    class="filter-label"
                    for="filter-classic"
                >
                    參考範例
                </label>


                <select
                    id="filter-classic"
                    class="
                        form-select
                        form-select-sm
                    "
                    onchange="applyFilters()"
                >

                    <option value="all">
                        全部狀態
                    </option>

                    <option value="true">
                        僅顯示參考範例
                    </option>

                </select>

            </div>

        </div>

    </div>



    <!-- ===================================================== -->
    <!-- Analysis explanation -->
    <!-- ===================================================== -->

    <div class="feedback-info-bar">

        <div class="feedback-info-main">

            <strong>
                分析摘要
            </strong>

            列表僅呈現關鍵分析結果。
            完整回饋、分析依據、Valence、Arousal、
            Job Demands 與 Job Resources
            可由「查看分析詳情」檢視。

        </div>


        <div class="feedback-info-tags">

            <span class="feedback-info-tag">
                Russell Valence × Arousal
            </span>

            <span class="feedback-info-tag">
                JD-R
            </span>

        </div>

    </div>



    <!-- ===================================================== -->
    <!-- Table -->
    <!-- ===================================================== -->

    <div class="feedback-table-card">

        <div class="feedback-table-card-header">

            <div>

                <h3 class="feedback-table-card-title">
                    回饋明細
                </h3>


                <div class="feedback-table-card-description">
                    可搜尋、排序、校正、設定參考範例或刪除資料。
                </div>

            </div>

        </div>



        <div class="feedback-table-scroll">

            <table
                id="feedbackTable"
                class="
                    table
                    align-middle
                "
            >

                <thead>

                    <tr>

                        <th>
                            時間與分類
                        </th>

                        <th>
                            回饋內容
                        </th>

                        <th>
                            分析摘要
                        </th>

                        <th>
                            操作
                        </th>

                    </tr>

                </thead>


                <tbody id="feedbackTableBody">

                    <tr>

                        <td
                            colspan="4"
                            class="
                                text-center
                                text-muted
                                py-5
                            "
                        >
                            資料載入中...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>



<script>

    /*
        清除回饋管理頁的所有篩選。
        不影響 Dashboard 的圖表篩選。
    */

    function resetFeedbackFilters() {

        const startDate =
            document.getElementById(
                'filter-start-date'
            );


        const endDate =
            document.getElementById(
                'filter-end-date'
            );


        const department =
            document.getElementById(
                'filter-dept'
            );


        const sentiment =
            document.getElementById(
                'filter-sentiment'
            );


        const category =
            document.getElementById(
                'filter-category'
            );


        const classic =
            document.getElementById(
                'filter-classic'
            );


        const sort =
            document.getElementById(
                'sort-order'
            );



        if (startDate) {
            startDate.value = '';
        }


        if (endDate) {
            endDate.value = '';
        }


        if (department) {
            department.value = 'all';
        }


        if (sentiment) {
            sentiment.value = 'all';
        }


        if (category) {
            category.value = 'all';
        }


        if (classic) {
            classic.value = 'all';
        }


        if (sort) {
            sort.value = 'desc';
        }



        localStorage.setItem(
            'adminPreferredSort',
            'desc'
        );


        applyFilters();

    }

</script>
